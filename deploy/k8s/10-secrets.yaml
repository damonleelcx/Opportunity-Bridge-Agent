# The DeepSeek key never appears in a manifest, a command line or an SSM
# invocation. It lives in AWS Secrets Manager and is pulled into the cluster by
# the External Secrets Operator already running on this box, using the node's
# own IAM role — the same mechanism the heros namespace uses.
#
# Rotating the key is then one API call against Secrets Manager; the operator
# re-syncs within the refresh interval and the pod picks it up on its next roll.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: opportunity-bridge
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opportunity-bridge-model
  namespace: opportunity-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: opportunity-bridge-model
    creationPolicy: Owner
  data:
    - secretKey: DEEPSEEK_API_KEY
      remoteRef:
        key: opportunity-bridge/model
        property: DEEPSEEK_API_KEY
    - secretKey: OBA_SEARCH_API_KEY
      remoteRef:
        key: opportunity-bridge/model
        property: OBA_SEARCH_API_KEY
    # The speech key. Travels the same way the model key does — Secrets Manager,
    # pulled by the operator with the node's own IAM role — because it is spendable
    # and because /api/tts is reachable by anyone holding a sign-in.
    #
    # Absent, read-aloud still works: the browser uses its own built-in voice and
    # startup logs TTS_DISABLED. So removing this property degrades the voice, it
    # does not break the feature. See docs/17-read-aloud.md.
    - secretKey: OBA_TTS_API_KEY
      remoteRef:
        key: opportunity-bridge/model
        property: OBA_TTS_API_KEY
    # The relay credential. 🔴 ITS OWN LOGIN, under this deployment's OWN secret
    # path — not the one heros-agent's platform reads.
    #
    # The alternative was to widen this node role to read `heros/platform`, which
    # would mean a compromise of this service also hands over the credential the
    # other one mails with. A separate Dovecot user on the same relay is
    # independently revocable and needs no cross-project IAM.
    #
    # ⚠️ ABSENT UNTIL SOMEBODY MINTS IT. With no value here the pod starts
    # normally, logs MAIL_DISABLED, and password reset is unavailable — it does
    # not crash and it does not silently pretend to send.
    # See docs/bugfix/2026-08-31-email-verification-and-reset.md
    - secretKey: OBA_SMTP_USERNAME
      remoteRef:
        key: opportunity-bridge/mail
        property: OBA_SMTP_USERNAME
    - secretKey: OBA_SMTP_PASSWORD
      remoteRef:
        key: opportunity-bridge/mail
        property: OBA_SMTP_PASSWORD
---
# Account settings. This used to carry OBA_INVITE_CODES, which was the only
# thing standing between a public registration form and a paid model key — hence
# the AWS Secrets Manager route, pulled in by the operator using the node's own
# IAM role, never in a manifest or an SSM invocation.
#
# Sign-up is OPEN now and no invite code is read, so that property is no longer
# synced. It is left in the AWS secret rather than deleted, so that re-gating is
# a one-line change here rather than a key nobody can find again. Nothing reads
# it while this list omits it.
#
# OBA_DEMO_ACCOUNT  the account that adopts data from before accounts existed
# See docs/bugfix/2026-09-01-sign-up-no-longer-needs-an-invite-code.md
# See docs/bugfix/2026-08-28-data-exposure-no-ownership-checks.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opportunity-bridge-auth
  namespace: opportunity-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: opportunity-bridge-auth
    creationPolicy: Owner
  data:
    - secretKey: OBA_DEMO_ACCOUNT
      remoteRef:
        key: opportunity-bridge/auth
        property: OBA_DEMO_ACCOUNT
---
# The database DSN. It is one whole connection string rather than a host, a user
# and a password an overlay reassembles, for the same reason the heros platform
# does it this way: the DSN is the single value that decides WHICH database the
# schema is applied to and the records are written to, and splitting it puts a
# connection string in a manifest in every form except the useful one.
#
# The database itself is created by deploy/bootstrap-db.sh, which reads this
# same secret. Rotating the password means writing it here and re-running that
# script; the operator re-syncs within the refresh interval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opportunity-bridge-db
  namespace: opportunity-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: opportunity-bridge-db
    creationPolicy: Owner
  data:
    - secretKey: OBA_DATABASE_URL
      remoteRef:
        key: opportunity-bridge/db
        property: OBA_DATABASE_URL
---
# The external talent vendor key. PDL ONLY — Apollo is deliberately not wired,
# because its People Search is not included in the Free plan and a key that
# always answers 403 would produce a permanent partial failure on every scan.
#
# 🔴 ITS OWN ExternalSecret, under its own secret path, NOT a property added to
# opportunity-bridge/model. That is the whole point of the separation: a `data`
# entry whose remote property does not exist makes the ENTIRE ExternalSecret fail
# to sync, so adding OBA_PDL_API_KEY to the model secret would have taken
# DEEPSEEK_API_KEY down with it the moment it was applied ahead of the value
# being minted — an outage caused by wiring an optional feature.
#
# ⚠️ ABSENT UNTIL SOMEBODY MINTS IT, and that is a supported state. This
# ExternalSecret simply stays NotReady, the target Secret is not created, and the
# deployment references it with `optional: true` so the pod starts anyway. The
# agent then reports the market outside the pool as UNKNOWN rather than small,
# which is the designed off-state — see internal/tools/recruiter.go,
# EXTERNAL_SCAN_NOT_CONFIGURED.
#
# To switch it on, create the secret and roll the pod:
#   aws secretsmanager create-secret --name opportunity-bridge/talent \
#     --secret-string '{"OBA_PDL_API_KEY":"<key>"}' --region us-east-1
#   sudo k3s kubectl -n opportunity-bridge rollout restart deploy/opportunity-bridge
#
# The roll is required, not optional: envFrom is read once at container start, so
# a Secret that appears later does not reach a running pod.
#
# ‼️ It is SPENDABLE and the pool it queries is shared: PDL's free tier is 100
# lookups a month for the whole deployment, and any recruiter session consumes it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opportunity-bridge-talent
  namespace: opportunity-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: opportunity-bridge-talent
    creationPolicy: Owner
  data:
    - secretKey: OBA_PDL_API_KEY
      remoteRef:
        key: opportunity-bridge/talent
        property: OBA_PDL_API_KEY
