# One replica, deliberately.
#
# Session state is a JSON snapshot on a local volume, so a second replica would
# split conversations at random depending on which pod the request landed on.
# Making this horizontally scalable means moving state out first; until then,
# saying so here is more honest than a replica count that looks scalable and
# silently loses people's context.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opportunity-bridge-state
  namespace: opportunity-bridge
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opportunity-bridge
  namespace: opportunity-bridge
  labels:
    app.kubernetes.io/name: opportunity-bridge
spec:
  replicas: 1
  strategy:
    # The state volume is ReadWriteOnce on a single node, so the old pod has to
    # let go before the new one can start.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opportunity-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opportunity-bridge
    spec:
      # ── Reaching the mail relay ────────────────────────────────────────────
      #
      # The relay is a pod in the `heros` namespace on this same cluster, and it
      # presents a certificate for `mail.heros-agent.space`. STARTTLS verifies
      # that name, so the name is what must be dialled — and the pinned ClusterIP
      # is how this pod, and only this pod, resolves it.
      #
      # 🔴 NOT A COREDNS REWRITE. A cluster-wide rewrite of this public name also
      # answers cert-manager's HTTP-01 self-check for it, pointing the controller
      # that proves the name at an SMTP port. The challenge stays pending, no
      # certificate is issued, and — worse — doing it AFTER a certificate exists
      # works until the 60-day renewal fails the same silent way.
      #
      # The address is the pinned clusterIP in heros-agent's own mail.yaml. It is
      # pinned there precisely so entries like this one stay correct.
      # See docs/bugfix/2026-08-31-email-verification-and-reset.md
      hostAliases:
        - ip: 10.43.120.55
          hostnames: [mail.heros-agent.space]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obagent
          image: docker.io/library/opportunity-bridge:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: opportunity-bridge-config
            - secretRef:
                name: opportunity-bridge-model
            - secretRef:
                name: opportunity-bridge-auth
            - secretRef:
                name: opportunity-bridge-db
          # Startup is fail-fast on anything that would make the agent dishonest
          # — an unreadable corpus, a missing model credential — so a pod that
          # is Running has a corpus it can cite and a key it can use.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /app/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: opportunity-bridge-state
