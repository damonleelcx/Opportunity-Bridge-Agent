# Every knob the process reads. Nothing here is a secret; the model credential
# comes from the ExternalSecret next door.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opportunity-bridge-config
  namespace: opportunity-bridge
data:
  OBA_ADDR: ":8787"
  OBA_BACKEND: "deepseek"
  OBA_REPLY_LANGUAGE: "zh-CN"
  OBA_CORPUS_DIR: "/app/data"
  # EMPTY ON PURPOSE, and not simply deleted: the image sets this variable
  # itself, so removing the line here would leave the image's default in place
  # and the process would log that it is ignoring a path — every start, forever.
  # Empty means "there is no file backend", which is the truth: OBA_DATABASE_URL
  # is set below via its Secret, and postgres is the durable home.
  #
  # The volume stays mounted for now. It still holds the pre-migration
  # oba.json, which is the only copy of this data that predates the database.
  OBA_STATE_PATH: ""
  # Model ids follow OBA_BACKEND; set explicitly here so a deployment reads what
  # it is actually running without anyone having to know the default table.
  OBA_AGENT_MODEL: "deepseek-v4-pro"
  OBA_CLASSIFIER_MODEL: "deepseek-v4-flash"
  # Budgets. Lower than the local defaults on purpose: this endpoint is public,
  # and every iteration is somebody's tokens.
  OBA_MAX_ITERATIONS: "6"
  OBA_MAX_TOOL_CALLS: "12"
  OBA_MAX_WALLCLOCK_SEC: "150"
  # Daily spending ceilings, in tokens. The budgets above bound ONE turn; these
  # bound how many. Both matter now that sign-up needs no invite code and
  # anybody with the address can hold an account.
  #
  # Two of them because one is not enough: accounts are free, so a per-account
  # allowance on its own multiplies by however many somebody registers.
  # OBA_DEPLOYMENT_DAILY_TOKENS is the circuit breaker across all of them — when
  # it trips NOBODY is answered until 00:00 UTC, which is why it sits well above
  # normal use. /api/health reports `spend_today_tokens` against it, so set this
  # from a week of real readings rather than from the value shipped here.
  # See docs/bugfix/2026-09-01-per-account-and-deployment-spend-caps.md
  OBA_ACCOUNT_DAILY_TOKENS: "2000000"
  OBA_DEPLOYMENT_DAILY_TOKENS: "50000000"
  OBA_K_ANONYMITY: "5"
  # Which search vendor the live lookup uses. Named explicitly rather than left
  # to the default, for the same reason the model ids are: a deployment should
  # read what it is actually running. The key itself arrives via the
  # opportunity-bridge-model Secret; without it the lookup is off and says so.
  OBA_SEARCH_PROVIDER: "bocha"
  # Read-aloud voice. Neither of these is a secret: the voice id is the public
  # model id from its fish.audio URL, and the backbone is a published name. The
  # key itself arrives via the opportunity-bridge-model Secret; without it the
  # browser reads answers in its own voice and startup says so.
  #
  # The voice is "cute japanese girl". Named here rather than defaulted in code
  # for the same reason the model ids are: a deployment should be readable as
  # what it is actually running.
  OBA_TTS_VOICE_ID: "df5c6c19dca944918dcbd6f1368fd02f"
  # s2.1-pro-free bills nothing. It is ALSO the backbone whose published terms
  # say requests may be used to improve model quality, and what this sends is the
  # answer — a person's city, their employment situation, the benefit they are
  # claiming. Switching to s2.1-pro costs about $0.018 an answer and is the lever
  # if that trade stops being acceptable. See docs/17-read-aloud.md.
  OBA_TTS_MODEL: "s2.1-pro-free"

  # ── Outgoing mail ──────────────────────────────────────────────────────────
  #
  # Address confirmation and password reset. Without them, somebody who forgets
  # their password loses the account and everything hanging off its subject —
  # the profile, the tracked tasks, the consents — and there is no support desk
  # here that could identify them.
  #
  # 🔴 THE HOST IS THE NAME ON THE RELAY'S CERTIFICATE, NOT A SERVICE NAME.
  # STARTTLS verifies it, and Let's Encrypt will not sign a `.svc.cluster.local`
  # name. The right pod is reached by the `hostAliases` entry in
  # 30-deployment.yaml — NOT by a CoreDNS rewrite, which would also answer
  # cert-manager's own challenge self-check for this name and break the relay's
  # certificate renewal sixty days later with nothing pointing at the cause.
  # That happened once already; see heros-agent's mail.yaml.
  #
  # ⚠️ FROM IS `jobs@`, NOT `support@`, AND THAT IS FORCED. The relay runs with
  # SPOOF_PROTECTION=1, which permits a login to send only as its own address or
  # an alias pointing at it. Sending as `support@` would need an alias
  # `support@ -> oba@`, and that alias also changes where inbound support@ mail
  # is DELIVERED. Reply-To carries the intent instead: a person who replies
  # reaches the support mailbox, and no inbound routing changes.
  # See docs/bugfix/2026-08-31-email-verification-and-reset.md
  OBA_SMTP_HOST: "mail.heros-agent.space"
  OBA_SMTP_PORT: "587"
  OBA_SMTP_FROM: "jobs@heros-agent.space"
  OBA_SMTP_REPLY_TO: "support@heros-agent.space"
  # Every link in an outgoing message is absolute against this. There is NO
  # default: a guessed origin sends mail that is either useless (localhost) or
  # dangerous (whatever Host header a request carried). Mail stays OFF without
  # it, and startup logs MAIL_DISABLED naming the missing piece.
  OBA_PUBLIC_ORIGIN: "https://jobs.heros-agent.space"
