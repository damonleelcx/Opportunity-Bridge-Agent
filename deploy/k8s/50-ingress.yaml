apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: opportunity-bridge
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Every turn spends model tokens. This is no longer the only thing standing
# between a stranger and that budget — sign-in is, as of
# docs/bugfix/2026-08-28-data-exposure-no-ownership-checks.md — but it still
# caps sign-in guessing and the cost of a single noisy account.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: opportunity-bridge
spec:
  rateLimit:
    average: 30
    burst: 60
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 0
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opportunity-bridge
  namespace: opportunity-bridge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: opportunity-bridge-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jobs.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opportunity-bridge
                port:
                  number: 8787
  tls:
    - hosts: ["jobs.heros-agent.space"]
      secretName: opportunity-bridge-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opportunity-bridge-http-redirect
  namespace: opportunity-bridge
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: opportunity-bridge-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jobs.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opportunity-bridge
                port:
                  number: 8787
