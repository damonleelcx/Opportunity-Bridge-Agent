apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: opportunity-bridge
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Every turn spends model tokens, and this is the main thing standing between a
# stranger and that budget.
#
# It was demoted when accounts arrived (2026-08-28-data-exposure-no-ownership-
# checks.md) and PROMOTED BACK when sign-up stopped needing an invite code
# (2026-09-01-sign-up-no-longer-needs-an-invite-code.md): anybody can hold an
# account now, and there is no per-account spend cap, so this per-IP limit plus
# the per-turn ceilings in agent.Budget are what bound the cost. Loosening it is
# a spending decision, not a tuning one.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: opportunity-bridge
spec:
  rateLimit:
    average: 30
    burst: 60
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 0
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opportunity-bridge
  namespace: opportunity-bridge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: opportunity-bridge-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jobs.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opportunity-bridge
                port:
                  number: 8787
  tls:
    - hosts: ["jobs.heros-agent.space"]
      secretName: opportunity-bridge-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opportunity-bridge-http-redirect
  namespace: opportunity-bridge
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: opportunity-bridge-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jobs.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opportunity-bridge
                port:
                  number: 8787
